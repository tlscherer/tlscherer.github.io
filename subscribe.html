<!-- Pop-up Modal Structure -->
<div id="subscribe-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 9999; justify-content: center; align-items: center;">
  <div style="background: white; padding: 2em; border-radius: 8px; max-width: 450px; width: 90%; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
    
    <!-- Close Button -->
    <span onclick="closeSubscribeModal()" style="position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; color: #6c757d;">&times;</span>

    <form id="google-sheet-modal-form">
      <div style="margin-bottom: 1.25em;">
        <label for="modal-email" style="display: block; font-weight: 600; margin-bottom: 0.5em;">Get Updates on New Posts</label>
        <input 
          type="email" 
          id="modal-email" 
          name="email" 
          placeholder="you@example.com" 
          required 
          style="width: 100%; padding: 0.6em; border: 1px solid #ced4da; border-radius: 4px;"
        >
      </div>

      <!-- Category Selection Checkboxes -->
      <div style="margin-bottom: 1.25em;">
        <label style="display: block; font-weight: 600; margin-bottom: 0.5em;">Select Topics</label>
        
        <label style="display: block; margin-bottom: 0.3em; cursor: pointer;">
          <input type="checkbox" id="modal-cat-all" value="All" checked> <b>All Topics</b>
        </label>
        
        <label style="display: block; margin-bottom: 0.3em; margin-left: 0.8em; cursor: pointer;">
          <input type="checkbox" class="modal-cat-option" value="ForeignPolicy" checked> Foreign Policy
        </label>
        
        <label style="display: block; margin-bottom: 0.3em; margin-left: 0.8em; cursor: pointer;">
          <input type="checkbox" class="modal-cat-option" value="Gaming" checked> Gaming
        </label>
      </div>

      <button 
        type="submit" 
        id="modal-submit-btn" 
        style="width: 100%; padding: 0.6em 1.4em; background-color: #0d6efd; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer;"
      >
        Subscribe
      </button>
      
      <div id="modal-form-message" style="margin-top: 1em; display: none; font-weight: 600; text-align: center;"></div>
    </form>
  </div>
</div>

<script>
  window.openSubscribeModal = function() {
    const modal = document.getElementById('subscribe-modal');
    if (modal) {
      modal.style.display = 'flex';
    }
  };

  window.closeSubscribeModal = function() {
    const modal = document.getElementById('subscribe-modal');
    if (modal) {
      modal.style.display = 'none';
    }
  };

  // Checkbox toggle logic
  document.addEventListener('change', function(e) {
    const catAll = document.getElementById('modal-cat-all');
    const catOptions = document.querySelectorAll('.modal-cat-option');

    if (e.target === catAll) {
      catOptions.forEach(cb => cb.checked = catAll.checked);
    } else if (e.target.classList.contains('modal-cat-option')) {
      const allChecked = Array.from(catOptions).every(cb => cb.checked);
      catAll.checked = allChecked;
    }
  });

  // Attach global click handler (bypasses DOMContentLoaded timing issues)
  document.addEventListener('click', function(e) {
    const target = e.target.closest('.open-subscribe-modal') || e.target.closest('a[href="#subscribe"]');
    if (target) {
      e.preventDefault();
      e.stopPropagation();
      window.openSubscribeModal();
    }

    // Close modal when clicking backdrop
    const modal = document.getElementById('subscribe-modal');
    if (modal && e.target === modal) {
      window.closeSubscribeModal();
    }
  });

  // Google Apps Script Form Submission
  const scriptURL = 'https://script.google.com/macros/s/AKfycbwweb_Yyv2teVGGLyQAyTG19g9zxNMVRp-lJNEzhYrx_dIwlFPL9j-xXFDXSJigzpDCtQ/exec';
  
  document.addEventListener('submit', function(e) {
    if (e.target && e.target.id === 'google-sheet-modal-form') {
      e.preventDefault();
      const modalBtn = document.getElementById('modal-submit-btn');
      const modalMsg = document.getElementById('modal-form-message');
      const catAll = document.getElementById('modal-cat-all');
      const catOptions = document.querySelectorAll('.modal-cat-option');

      // Gather selected categories
      let selectedCategories = [];
      if (catAll && catAll.checked) {
        selectedCategories.push("All");
      } else {
        catOptions.forEach(cb => {
          if (cb.checked) selectedCategories.push(cb.value);
        });
      }

      if (selectedCategories.length === 0) {
        modalMsg.style.display = 'block';
        modalMsg.style.color = '#dc3545';
        modalMsg.innerText = 'Please select at least one topic.';
        return;
      }

      modalBtn.disabled = true;
      modalBtn.innerText = 'Submitting...';

      const formData = new FormData();
      formData.append('email', document.getElementById('modal-email').value);
      formData.append('categories', selectedCategories.join(', '));

      fetch(scriptURL, { 
        method: 'POST', 
        mode: 'no-cors', 
        body: formData 
      })
        .then(response => {
          modalMsg.style.display = 'block';
          modalMsg.style.color = '#198754';
          modalMsg.innerText = 'Thank you! You are subscribed.';
          e.target.reset();
          if (catAll) catAll.checked = true;
          catOptions.forEach(cb => cb.checked = true);
          modalBtn.disabled = false;
          modalBtn.innerText = 'Subscribe';
          setTimeout(window.closeSubscribeModal, 2000);
        })
        .catch(error => {
          modalMsg.style.display = 'block';
          modalMsg.style.color = '#dc3545';
          modalMsg.innerText = 'Something went wrong. Please try again.';
          modalBtn.disabled = false;
          modalBtn.innerText = 'Subscribe';
        });
    }
  });
</script>
